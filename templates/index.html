<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz with HiM — Mini App</title>
    <!-- Official Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0F172A;
            --card-bg: #1E293B;
            --accent: #F59E0B;
            --text-color: #FFFFFF;
            --subtext: #94A3B8;
            --correct: #10B981;
            --wrong: #EF4444;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .header { text-align: center; margin-bottom: 20px; }
        .header h2 { margin: 0; color: var(--accent); font-size: 22px; }
        .header p { margin: 4px 0 0; color: var(--subtext); font-size: 13px; }
        .card {
            background: var(--card-bg);
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }
        .quiz-timer { font-size: 14px; color: var(--accent); font-weight: bold; margin-bottom: 12px; }
        .question-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; line-height: 1.4; }
        .option-btn {
            background: #0F172A;
            border: 1px solid #334155;
            color: var(--text-color);
            padding: 14px;
            border-radius: 10px;
            width: 100%;
            text-align: left;
            font-size: 14px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .option-btn:active { transform: scale(0.98); }
        .option-btn.correct { background: var(--correct) !important; color: #fff; font-weight: bold; }
        .option-btn.wrong { background: var(--wrong) !important; color: #fff; }
        .nav-btn {
            background: var(--accent);
            color: #000;
            font-weight: bold;
            border: none;
            padding: 14px;
            border-radius: 10px;
            width: 100%;
            font-size: 15px;
            margin-top: 10px;
            cursor: pointer;
        }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="header">
        <h2>⚡ Quiz with HiM</h2>
        <p>Visioned by Himanshu Sir</p>
    </div>

    <!-- START SCREEN -->
    <div id="start-screen" class="card">
        <h3 id="user-greeting">Welcome, Scholar! 👋</h3>
        <p style="color: var(--subtext); font-size: 14px;">Ready to test your Computer Awareness skills in full dynamic app mode?</p>
        <button class="nav-btn" onclick="startAppQuiz()">🚀 Start Computer Mock Test</button>
    </div>

    <!-- QUIZ CONTAINER -->
    <div id="quiz-screen" class="card hidden">
        <div class="quiz-timer" id="timer-display">⏱️ Time Left: 30s</div>
        <div class="question-title" id="q-text">Loading question...</div>
        <div id="options-container"></div>
        <div id="explanation-box" class="hidden" style="margin-top:12px; font-size:13px; color:var(--subtext); text-align:left;"></div>
        <button id="next-btn" class="nav-btn hidden" onclick="loadNextQuestion()">Next Question ➡️</button>
    </div>

    <!-- SCORE SCREEN -->
    <div id="score-screen" class="card hidden">
        <h3>🎉 Quiz Completed!</h3>
        <p id="score-text" style="font-size: 18px; font-weight: bold; color: var(--accent);"></p>
        <button class="nav-btn" onclick="closeMiniApp()">📥 View Detailed Report in Chat</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let currentQuestions = [];
        let currentIndex = 0;
        let userScore = 0;
        let timerInterval = null;
        let timeLeft = 30;

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('user-greeting').innerText = `Welcome, ${tg.initDataUnsafe.user.first_name}! 👋`;
        }

        async function startAppQuiz() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');

            const userId = tg.initDataUnsafe?.user?.id || 1091057353;
            try {
                const response = await fetch(`/api/get-questions?user_id=${userId}`);
                const data = await response.json();
                
                if (data.questions && data.questions.length > 0) {
                    currentQuestions = data.questions;
                    currentIndex = 0;
                    userScore = 0;
                    renderQuestion();
                } else {
                    document.getElementById('q-text').innerText = data.error || "No questions available or quota reached.";
                }
            } catch (err) {
                document.getElementById('q-text').innerText = "Failed to load questions. Please check connection.";
            }
        }

        function renderQuestion() {
            clearInterval(timerInterval);
            timeLeft = 30;
            document.getElementById('timer-display').innerText = `⏱️ Time Left: ${timeLeft}s`;
            
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer-display').innerText = `⏱️ Time Left: ${timeLeft}s`;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    autoSkip();
                }
            }, 1000);

            const q = currentQuestions[currentIndex];
            document.getElementById('q-text').innerText = `Q${currentIndex + 1}. ${q.question}`;
            document.getElementById('explanation-box').classList.add('hidden');
            document.getElementById('next-btn').classList.add('hidden');

            const container = document.getElementById('options-container');
            container.innerHTML = '';

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => selectOption(idx, q.correct_option, q.explanation);
                container.appendChild(btn);
            });
        }

        function selectOption(selectedIdx, correctIdx, exp) {
            clearInterval(timerInterval);
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(b => b.onclick = null);

            if (selectedIdx === correctIdx) {
                buttons[selectedIdx].classList.add('correct');
                userScore++;
            } else {
                buttons[selectedIdx].classList.add('wrong');
                buttons[correctIdx].classList.add('correct');
            }

            if (exp) {
                const expBox = document.getElementById('explanation-box');
                expBox.innerText = `💡 Explanation: ${exp}`;
                expBox.classList.remove('hidden');
            }

            document.getElementById('next-btn').classList.remove('hidden');
        }

        function autoSkip() {
            const q = currentQuestions[currentIndex];
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(b => b.onclick = null);
            buttons[q.correct_option].classList.add('correct');
            document.getElementById('next-btn').classList.remove('hidden');
        }

        function loadNextQuestion() {
            currentIndex++;
            if (currentIndex < currentQuestions.length) {
                renderQuestion();
            } else {
                finishQuiz();
            }
        }

        async function finishQuiz() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('score-screen').classList.remove('hidden');
            document.getElementById('score-text').innerText = `Score: ${userScore} / ${currentQuestions.length}`;

            const userId = tg.initDataUnsafe?.user?.id || 1091057353;
            await fetch('/api/submit-quiz', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: userId, score: userScore, total: currentQuestions.length })
            });
        }

        function closeMiniApp() {
            tg.close();
        }
    </script>
</body>
</html>
